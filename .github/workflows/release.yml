name: Release artifacts

on:
  pull_request:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Exact version, including the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-packaging:
    name: release archive and checksum gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - run: cargo install --locked --version 0.5.9 cargo-cyclonedx
      - name: Build and verify an unsigned candidate
        shell: bash
        run: |
          version="v$(cargo pkgid --package thunderboltd | sed 's/.*#//')"
          ./scripts/package-release.sh "$version" dist
          ./scripts/verify-release.sh --checksums-only dist
          test -s dist/SIGNING-INSTRUCTIONS.txt
          archive="$(find dist -maxdepth 1 -type f -name '*.tar.gz' ! -name '*-source.tar.gz' -print)"
          install -d "$RUNNER_TEMP/release-smoke"
          tar -xzf "$archive" -C "$RUNNER_TEMP/release-smoke"
          root="$(find "$RUNNER_TEMP/release-smoke" -mindepth 1 -maxdepth 1 -type d -print)"
          while read -r package binary extra; do
            if [[ -z "$package" || "$package" == \#* ]]; then
              continue
            fi
            "$root/bin/$binary" --help >/dev/null
            test -s "dist/$binary.cdx.json"
          done < release/default-binaries.txt
          grep -Fxq 'operator_runtime_capability=live-not-ready' "$root/BUILD-METADATA"
          test ! -e "$root/config"

  archive:
    name: archives (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - run: cargo install --locked --version 0.5.9 cargo-cyclonedx
      - name: Resolve release version
        id: version
        shell: bash
        env:
          # Pass the untrusted input through the environment instead of
          # interpolating `${{ inputs.version }}` straight into the script body,
          # which would allow command injection into this `run:` block.
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${DISPATCH_VERSION}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          # Reject anything that is not a plain version token before it is used
          # to build a package name or a release path.
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]; then
            echo "::error::refusing to package with unsupported version token" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package without publishing
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/package-release.sh "$RELEASE_VERSION" dist
          ./scripts/verify-release.sh --checksums-only dist
          archive="$(find dist -maxdepth 1 -type f -name '*.tar.gz' ! -name '*-source.tar.gz' -print)"
          install -d "$RUNNER_TEMP/release-smoke"
          tar -xzf "$archive" -C "$RUNNER_TEMP/release-smoke"
          root="$(find "$RUNNER_TEMP/release-smoke" -mindepth 1 -maxdepth 1 -type d -print)"
          while read -r package binary extra; do
            if [[ -z "$package" || "$package" == \#* ]]; then
              continue
            fi
            "$root/bin/$binary" --help >/dev/null
            test -s "dist/$binary.cdx.json"
          done < release/default-binaries.txt
          grep -Fxq 'operator_runtime_capability=live-not-ready' "$root/BUILD-METADATA"
          test ! -e "$root/config"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unsigned-release-${{ matrix.os }}-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: archive
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: unsigned-release-*-${{ github.sha }}
          path: release-input
      - name: Assemble release assets and notes
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable release tags must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          software_version="${VERSION#v}"
          manifest_version="$(awk '
            /^\[workspace\.package\]$/ { workspace_package = 1; next }
            workspace_package && /^version = / {
              gsub(/^version = "|"[[:space:]]*$/, "", $0)
              print
              exit
            }
          ' Cargo.toml)"
          if [[ "$manifest_version" != "$software_version" ]]; then
            echo "tag $VERSION does not match workspace version $manifest_version" >&2
            exit 1
          fi

          mapfile -t artifact_dirs < <(find release-input -mindepth 1 -maxdepth 1 -type d -print | sort)
          if [[ "${#artifact_dirs[@]}" -ne 2 ]]; then
            echo "expected exactly two platform artifact directories" >&2
            exit 1
          fi
          linux_dir="$(find release-input -mindepth 1 -maxdepth 1 -type d -name 'unsigned-release-ubuntu-*' -print -quit)"
          if [[ -z "$linux_dir" ]]; then
            echo "missing Ubuntu release artifact" >&2
            exit 1
          fi

          mkdir release-assets
          for artifact_dir in "${artifact_dirs[@]}"; do
            binary_archive="$(find "$artifact_dir" -maxdepth 1 -type f -name "bitcoin-thunderbolt-${software_version}-*.tar.gz" ! -name '*-source.tar.gz' -print)"
            if [[ -z "$binary_archive" ]]; then
              echo "missing platform binary archive in $artifact_dir" >&2
              exit 1
            fi
            cp "$binary_archive" release-assets/

            platform="${artifact_dir#release-input/unsigned-release-}"
            platform="${platform%-${GITHUB_SHA}}"
            for sbom in "$artifact_dir"/*.cdx.json; do
              sbom_name="${sbom##*/}"
              cp "$sbom" "release-assets/${sbom_name%.cdx.json}-${platform}.cdx.json"
            done
          done

          # gzip and zip output may differ across host implementations even when
          # both jobs package the same tagged source tree. Publish one canonical
          # source archive set from Ubuntu and retain both platform binaries.
          for shared_name in \
            "bitcoin-thunderbolt-${software_version}-source.tar.gz" \
            "bitcoin-thunderbolt-${software_version}-source.zip" \
            SIGNING-INSTRUCTIONS.txt; do
            reference="$linux_dir/$shared_name"
            test -s "$reference"
            cp "$reference" release-assets/
          done
          for artifact_dir in "${artifact_dirs[@]}"; do
            if ! cmp -s "$linux_dir/SIGNING-INSTRUCTIONS.txt" "$artifact_dir/SIGNING-INSTRUCTIONS.txt"; then
              echo "release instructions differ across platform artifacts" >&2
              exit 1
            fi
          done

          (
            cd release-assets
            sha256sum ./*.tar.gz ./*.zip ./*.cdx.json SIGNING-INSTRUCTIONS.txt |
              sed 's#  \./#  #'
          ) > release-assets/SHA256SUMS

          awk -v heading="## [$software_version]" '
            index($0, heading) == 1 { found = 1; capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish immutable versioned assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" release-assets/* \
            --verify-tag \
            --title "Bitcoin Thunderbolt $VERSION" \
            --notes-file release-notes.md \
            --latest
