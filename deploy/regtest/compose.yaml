name: bitcoin-thunderbolt-regtest

services:
  thunderboltd:
    build:
      context: ../..
      args:
        VERSION: 1.0.0
    image: bitcoin-thunderbolt:1.0.0
    command:
      - --config
      - /var/lib/thunderbolt/config/runtime.toml
      - start
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/thunderbolt-cli",
          "--config",
          "/var/lib/thunderbolt/config/runtime.toml",
          "status",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /run/thunderbolt:rw,noexec,nosuid,nodev,mode=0700,uid=10001,gid=10001,size=16m
    volumes:
      - type: bind
        source: ${THUNDERBOLT_CONFIG_DIR:?set THUNDERBOLT_CONFIG_DIR to the absolute owner-only configuration directory}
        target: /var/lib/thunderbolt/config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${THUNDERBOLT_DATA_DIR:?set THUNDERBOLT_DATA_DIR to the absolute owner-only data directory}
        target: /var/lib/thunderbolt/data
        bind:
          create_host_path: false
