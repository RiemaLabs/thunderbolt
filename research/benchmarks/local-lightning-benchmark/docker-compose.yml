services:
  bitcoind:
    image: ruimarinho/bitcoin-core:latest
    command:
      - -printtoconsole
      - -regtest=1
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0002
      - -rpcuser=rpcuser
      - -rpcpassword=rpcpass
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=rpcuser", "-rpcpassword=rpcpass", "getblockchaininfo"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin

  cln1:
    image: elementsproject/lightningd:latest
    environment:
      LIGHTNINGD_DATA: /root/.lightning
      BITCOIND_RPC_URL: http://rpcuser:rpcpass@bitcoind:18443
    command:
      - --network=regtest
      - --alias=cln1
      - --log-level=info
      - --bind-addr=0.0.0.0:9735
      - --bitcoin-rpcconnect=bitcoind
      - --bitcoin-rpcport=18443
      - --bitcoin-rpcuser=rpcuser
      - --bitcoin-rpcpassword=rpcpass
      - --bitcoin-datadir=/root/.bitcoin
      - --database-upgrade=true
    depends_on:
      bitcoind:
        condition: service_healthy
    volumes:
      - cln1-data:/root/.lightning
      - bitcoind-data:/root/.bitcoin:ro

  cln2:
    image: elementsproject/lightningd:latest
    environment:
      LIGHTNINGD_DATA: /root/.lightning
      BITCOIND_RPC_URL: http://rpcuser:rpcpass@bitcoind:18443
    command:
      - --network=regtest
      - --alias=cln2
      - --log-level=info
      - --bind-addr=0.0.0.0:9735
      - --bitcoin-rpcconnect=bitcoind
      - --bitcoin-rpcport=18443
      - --bitcoin-rpcuser=rpcuser
      - --bitcoin-rpcpassword=rpcpass
      - --bitcoin-datadir=/root/.bitcoin
      - --database-upgrade=true
    depends_on:
      bitcoind:
        condition: service_healthy
    volumes:
      - cln2-data:/root/.lightning
      - bitcoind-data:/root/.bitcoin:ro

volumes:
  bitcoind-data:
  cln1-data:
  cln2-data:
