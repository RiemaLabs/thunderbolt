[package]
name = "thunderbolt-core"
version = "0.1.0"
edition = "2021"
description = "The core implementation of Thunderbolt"

[dependencies]
serde = { version = "1.0.217" }
sha2 = { version = "0.10.8" }
thiserror = "2.0.12"
itertools = "0.12.0"
getset = "0.1"
num-bigint = "0.4"
pse-poseidon = { git = "https://github.com/axiom-crypto/pse-poseidon.git" }
num-traits = "0.2"

halo2-base = { git = "https://github.com/axiom-crypto/halo2-lib", tag = "v0.5.0" }
halo2-ecc = { git = "https://github.com/axiom-crypto/halo2-lib", tag = "v0.5.0" }

bitcoin = { version = "0.32.5", features = ["rand-std", "serde"] }
secp = { version = "0.5.0", features = ["rand", "secp256k1"] }
frost-secp256k1 = { version = "2.1.0"}

bitcoin-utils = { path = "../bitcoin-utils" }
musig2 = "0.2.4"
