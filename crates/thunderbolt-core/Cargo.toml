[package]
name = "thunderbolt-core"
version = "0.1.0"
edition = "2021"
description = "The core implementation of Thunderbolt"

[dependencies]
serde = { version = "1.0.217" }
sha2 = { version = "0.10.8" }
thiserror = "2.0.12"
num-bigint = "0.4"
num-traits = "0.2"

bitcoin = { version = "0.32.5", features = ["rand-std", "serde"] }
frost-secp256k1 = { version = "2.2.0"}
musig2 = { version = "0.2.4", features = ["secp256k1"] }
secp = { version = "0.5.0", features = ["rand", "secp256k1"] }
secp256k1 = { version = "0.31.1", features = ["rand", "serde"] }

bitcoin-utils = { path = "../bitcoin-utils" }

libpaillier = "0.6.0"
zeroize = "1.8.2"
rand = "0.9.2"


[features]
sanity-check = []