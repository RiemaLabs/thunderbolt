[package]
name = "bitcoin-utils"
version = "0.1.0"
edition = "2021"
description = "Utility functions and helpers for Bitcoin operations"

[dependencies]
bitcoin = { version = "0.32.5", features = ["rand", "serde"] }
secp = { version = "0.5.0", features = ["rand", "secp256k1"] }

thiserror = "2.0.12"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.140"
rand = { version = "0.9" }
