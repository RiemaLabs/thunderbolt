[package]
name = "thunderbolt-runtime-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified operator configuration for Bitcoin Thunderbolt"
keywords = ["bitcoin", "configuration", "operator", "thunderbolt"]
categories = ["config", "cryptography::cryptocurrencies"]

[lints]
workspace = true

[dependencies]
bitcoin = "0.32.5"
libc = "0.2.177"
rustix = { version = "1.1.2", features = ["process"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.217", features = ["derive"] }
sha2 = "0.10.9"
tendermint = "0.40.4"
thiserror = "2.0.16"
thunderbolt-bitcoin = { path = "../thunderbolt-bitcoin" }
thunderbolt-cometbft = { path = "../thunderbolt-cometbft" }
thunderbolt-cometbft-client = { path = "../thunderbolt-cometbft-client" }
thunderbolt-cometbft-rpc = { path = "../thunderbolt-cometbft-rpc", features = ["regtest"] }
thunderbolt-committee = { path = "../thunderbolt-committee" }
thunderbolt-committee-node = { path = "../thunderbolt-committee-node" }
thunderbolt-control = { path = "../thunderbolt-control" }
thunderbolt-holder-node = { path = "../thunderbolt-holder-node" }
thunderbolt-ledger = { path = "../thunderbolt-ledger" }
thunderbolt-ledger-abci = { path = "../thunderbolt-ledger-abci" }
thunderbolt-ledger-app = { path = "../thunderbolt-ledger-app" }
thunderbolt-protocol = { path = "../thunderbolt-protocol" }
thunderbolt-wire = { path = "../thunderbolt-wire" }
toml = "0.8.19"
url = "2.5.4"
zeroize = "1.8.2"

[dev-dependencies]
proptest = "1.7.0"
rcgen = "0.14.5"
tempfile = "3.27.0"
