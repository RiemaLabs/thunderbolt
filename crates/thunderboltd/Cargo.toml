[package]
name = "thunderboltd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fail-closed Bitcoin Thunderbolt operator runtime daemon"
repository.workspace = true
default-run = "thunderboltd"

[features]
default = []
legacy-v1 = [
    "dep:getrandom",
    "dep:thunderbolt-config",
    "dep:thunderbolt-node",
    "dep:thunderbolt-storage",
    "dep:toml",
    "dep:zeroize",
]

[[bin]]
name = "thunderboltd-legacy-v1"
path = "src/legacy_v1_main.rs"
required-features = ["legacy-v1"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
getrandom = { version = "0.3", optional = true }
serde_json = "1.0"
thiserror = "2.0"
thunderbolt-config = { path = "../thunderbolt-config", optional = true }
thunderbolt-control = { path = "../thunderbolt-control" }
thunderbolt-node = { path = "../thunderbolt-node", optional = true }
thunderbolt-runtime = { path = "../thunderbolt-runtime" }
thunderbolt-runtime-config = { path = "../thunderbolt-runtime-config" }
thunderbolt-storage = { path = "../thunderbolt-storage", optional = true }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = { version = "0.8", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
zeroize = { version = "1.8", optional = true }

[dev-dependencies]
hex = "0.4"
sha2 = "0.10.9"
tempfile = "3.20"
thunderbolt-ledger = { path = "../thunderbolt-ledger" }
thunderbolt-ledger-abci = { path = "../thunderbolt-ledger-abci" }
thunderbolt-protocol = { path = "../thunderbolt-protocol" }
toml = "0.8"

[lints]
workspace = true
