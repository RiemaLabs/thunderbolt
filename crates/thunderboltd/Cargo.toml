[package]
name = "thunderboltd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bitcoin Thunderbolt reference node daemon"
repository.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
serde_json = "1.0"
thiserror = "2.0"
thunderbolt-config = { path = "../thunderbolt-config" }
thunderbolt-node = { path = "../thunderbolt-node" }
thunderbolt-storage = { path = "../thunderbolt-storage" }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.20"

[lints]
workspace = true
