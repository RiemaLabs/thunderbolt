[package]
name = "thunderbolt-ledger-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded transport-neutral control-plane codec for the Bitcoin Thunderbolt Ledger"
keywords = ["bitcoin", "ledger", "protocol", "rpc"]
categories = ["cryptography::cryptocurrencies", "encoding"]

[lints]
workspace = true

[dependencies]
hex = "0.4"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
thiserror = "2.0.12"
thunderbolt-floor = { path = "../thunderbolt-floor" }
thunderbolt-keystore = { path = "../thunderbolt-keystore" }
thunderbolt-ledger = { path = "../thunderbolt-ledger" }
thunderbolt-protocol = { path = "../thunderbolt-protocol" }
thunderbolt-wire = { path = "../thunderbolt-wire" }

[dev-dependencies]
bitcoin = { version = "0.32.5", features = ["serde"] }
proptest = "1.7.0"
secp256k1 = { version = "0.31.1", features = ["rand"] }
