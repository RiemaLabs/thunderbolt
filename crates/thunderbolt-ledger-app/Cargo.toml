[package]
name = "thunderbolt-ledger-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Crash-safe SQLite application for the Bitcoin Thunderbolt v2 Ledger contract"
keywords = ["bitcoin", "ledger", "sqlite", "state-machine"]
categories = ["database", "cryptography::cryptocurrencies"]

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.16"
thunderbolt-ledger = { path = "../thunderbolt-ledger" }
thunderbolt-protocol = { path = "../thunderbolt-protocol" }
thunderbolt-wire = { path = "../thunderbolt-wire" }

[dev-dependencies]
bitcoin = { version = "0.32.5", features = ["serde"] }
proptest = "1.7.0"
secp256k1 = { version = "0.31.1", features = ["rand"] }
tempfile = "3.27.0"
