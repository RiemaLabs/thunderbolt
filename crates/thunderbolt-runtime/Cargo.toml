[package]
name = "thunderbolt-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Role-aware operator runtime for Bitcoin Thunderbolt"
keywords = ["bitcoin", "operator", "runtime", "thunderbolt"]
categories = ["cryptography::cryptocurrencies"]

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
hex = "0.4"
libc = "0.2.177"
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.16"
thunderbolt-control = { path = "../thunderbolt-control" }
thunderbolt-runtime-config = { path = "../thunderbolt-runtime-config" }
tokio = { version = "1.47", features = ["sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.47", features = ["macros", "rt"] }
