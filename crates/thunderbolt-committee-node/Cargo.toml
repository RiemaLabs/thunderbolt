[package]
name = "thunderbolt-committee-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Restart-safe Committee role service for Bitcoin Thunderbolt"
keywords = ["bitcoin", "committee", "sqlite", "protocol"]
categories = ["cryptography::cryptocurrencies", "database", "network-programming"]

[lints]
workspace = true

[dependencies]
bitcoin = "0.32.5"
getrandom = "0.3.4"
libc = "0.2.177"
rustix = { version = "1.1.2", features = ["process"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.16"
thunderbolt-committee = { path = "../thunderbolt-committee" }
thunderbolt-keystore = { path = "../thunderbolt-keystore" }
thunderbolt-ledger = { path = "../thunderbolt-ledger" }
thunderbolt-protocol = { path = "../thunderbolt-protocol" }
thunderbolt-wire = { path = "../thunderbolt-wire" }

[dev-dependencies]
libpaillier = "0.6.0"
proptest = "1.7.0"
secp = { version = "0.5.0", features = ["rand", "secp256k1"] }
secp256k1 = { version = "0.31.1", features = ["rand"] }
tempfile = "3.27.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
thunderbolt-core = { path = "../thunderbolt-core" }
thunderbolt-committee = { path = "../thunderbolt-committee", features = ["insecure-regtest"] }
