[package]
name = "thunderbolt-mock"
version = "0.1.0"
edition = "2021"
description = "The mock implementation of Thunderbolt, including integration tests."

[dependencies]
lazy_static = "1.5.0"
bitcoin = { version = "0.32.5", features = ["serde"] }
secp = { version = "0.5.0", features = ["rand", "secp256k1"] }

bitcoin-utils = { path = "../bitcoin-utils" }
bitcoin-clients = { path = "../bitcoin-clients" }
thunderbolt-core = { path = "../thunderbolt-core" }

[dev-dependencies]
tokio = { version = "1.42.0", features = ["macros"] }
