[package]
name = "thunderbolt-ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic protocol-v2 Ledger contract for Bitcoin Thunderbolt"
keywords = ["bitcoin", "ledger", "protocol", "consensus"]
categories = ["cryptography::cryptocurrencies", "data-structures"]

[lints]
workspace = true

[dependencies]
hex = "0.4"
secp256k1 = "0.31.1"
serde = { version = "1.0.217", features = ["derive"] }
sha2 = "0.10.8"
thiserror = "2.0.12"
thunderbolt-wire = { path = "../thunderbolt-wire" }

[dev-dependencies]
bitcoin = { version = "0.32.5", features = ["serde"] }
proptest = "1.7.0"
serde_json = "1.0"
