[package]
name = "thunderbolt-committee"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "One-member-per-process committee runtime for Bitcoin Thunderbolt"
keywords = ["bitcoin", "threshold", "committee", "protocol"]
categories = ["cryptography::cryptocurrencies", "network-programming"]

[lints]
workspace = true

[features]
default = []
# This feature creates every committee secret in one process. It is deliberately
# excluded from production builds and exists only for isolated regtest setups.
insecure-regtest = []

[dependencies]
bitcoin = { version = "0.32.5", features = ["rand-std", "serde"] }
libpaillier = "0.6.0"
secp = { version = "0.5.0", features = ["rand", "secp256k1"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_bare = "0.5"
sha2 = "0.10.8"
thiserror = "2.0.12"
thunderbolt-core = { path = "../thunderbolt-core" }
thunderbolt-keystore = { path = "../thunderbolt-keystore" }
thunderbolt-protocol = { path = "../thunderbolt-protocol" }
thunderbolt-wire = { path = "../thunderbolt-wire" }
zeroize = "1.8.2"

[dev-dependencies]
proptest = "1.7"
tempfile = "3.27.0"
