[package]
name = "thunderbolt-abci-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Production-bounded local ABCI 2.0 server for Bitcoin Thunderbolt"
keywords = ["bitcoin", "cometbft", "abci", "server"]
categories = ["network-programming"]

[lints]
workspace = true

[dependencies]
prost = "=0.13.5"
rustix = { version = "1.1.4", features = ["fs", "process"] }
socket2 = "0.6.5"
tendermint-abci = "=0.40.4"
tendermint-proto = "=0.40.4"
thiserror = "2.0.16"

[dev-dependencies]
proptest = "1.9.0"
tempfile = "3.27.0"
