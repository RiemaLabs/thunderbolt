[package]
name = "thunderbolt-bitcoin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fail-closed Bitcoin Core backend and settlement validators for Bitcoin Thunderbolt"
keywords = ["bitcoin", "json-rpc", "thunderbolt"]
categories = ["cryptography::cryptocurrencies", "network-programming"]

[dependencies]
bitcoin = { version = "0.32.5", features = ["serde"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustix = { version = "1.1", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["time"] }
url = "2.5"
zeroize = "1.8"

[dev-dependencies]
proptest = "1.7"
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
