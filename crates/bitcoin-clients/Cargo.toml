[package]
name = "bitcoin-clients"
version = "0.1.0"
edition = "2021"
description = "Utility clients for Bitcoin RPC access"

[dependencies]
anyhow = "1.0.97"
async-trait = "0.1.87"
reqwest = { version = "0.12.15", features = ["json"] }
bitcoin = { version = "0.32.5", features = ["serde"] }
thiserror = "2.0.12"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.140"


[dev-dependencies]
tokio = { version = "1.42.0", features = ["macros"] }