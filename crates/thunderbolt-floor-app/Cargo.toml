[package]
name = "thunderbolt-floor-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic signed rollback-floor state machine for Bitcoin Thunderbolt"
keywords = ["bitcoin", "consensus", "security", "thunderbolt"]
categories = ["cryptography::cryptocurrencies", "database"]

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
secp256k1 = { version = "0.31.1", features = ["rand"] }
sha2 = "0.10.9"
thiserror = "2.0.16"
thunderbolt-floor = { path = "../thunderbolt-floor" }
thunderbolt-keystore = { path = "../thunderbolt-keystore" }

[dev-dependencies]
proptest = "1.9.0"
tempfile = "3.27.0"
