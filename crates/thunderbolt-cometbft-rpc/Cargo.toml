[package]
name = "thunderbolt-cometbft-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Authenticated streaming CometBFT RPC transport for Bitcoin Thunderbolt"
keywords = ["bitcoin", "cometbft", "rpc", "rustls", "thunderbolt"]
categories = ["cryptography::cryptocurrencies", "network-programming"]

[features]
default = []
regtest = []

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
libc = "0.2.177"
rustix = { version = "1.1.2", features = ["process"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tendermint = "0.40.4"
tendermint-light-client-verifier = "0.40.4"
thiserror = "2.0.16"
thunderbolt-cometbft = { path = "../thunderbolt-cometbft" }
thunderbolt-cometbft-client = { path = "../thunderbolt-cometbft-client" }
tokio = { version = "1.48.0", features = ["io-util", "net", "rt", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs", "tls12"] }
url = "2.5.8"
zeroize = "1.8.2"

[dev-dependencies]
ed25519-consensus = "2.1.0"
rcgen = "0.14.5"
tempfile = "3.27.0"
thunderbolt-ledger = { path = "../thunderbolt-ledger" }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
