[package]
name = "thunderbolt-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded public proof messages for Bitcoin Thunderbolt"

[lints]
workspace = true

[dependencies]
bitcoin = { version = "0.32.5", features = ["serde"] }
hex = "0.4"
libpaillier = { version = "0.6.0", optional = true }
secp = { version = "0.5.0", features = ["secp256k1"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
thiserror = "2.0.12"
thunderbolt-core = { path = "../thunderbolt-core", default-features = false }

[features]
default = ["insecure-regression"]
insecure-regression = ["dep:libpaillier", "thunderbolt-core/insecure-regression"]

[dev-dependencies]
proptest = "1.7.0"
thunderbolt-paillier = { path = "../thunderbolt-paillier" }
zeroize = "1.8.2"
