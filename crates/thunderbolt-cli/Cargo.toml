[package]
name = "thunderbolt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Owner-only Unix control CLI for Bitcoin Thunderbolt runtimes"
repository.workspace = true
default-run = "thunderbolt-cli"

[features]
default = []
legacy-v1 = [
    "dep:libc",
    "dep:reqwest",
    "dep:thunderbolt-config",
    "dep:thunderbolt-protocol",
    "dep:zeroize",
]

[[bin]]
name = "thunderbolt-cli-legacy-v1"
path = "src/legacy_v1_main.rs"
required-features = ["legacy-v1"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
libc = { version = "0.2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde_json = "1.0"
thiserror = "2.0"
thunderbolt-config = { path = "../thunderbolt-config", optional = true }
thunderbolt-control = { path = "../thunderbolt-control" }
thunderbolt-protocol = { path = "../thunderbolt-protocol", optional = true }
thunderbolt-runtime = { path = "../thunderbolt-runtime" }
thunderbolt-runtime-config = { path = "../thunderbolt-runtime-config" }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
zeroize = { version = "1.8", optional = true }

[dev-dependencies]
sha2 = "0.10.9"
tempfile = "3.20"
thunderbolt-ledger = { path = "../thunderbolt-ledger" }
thunderbolt-ledger-abci = { path = "../thunderbolt-ledger-abci" }
thunderbolt-protocol = { path = "../thunderbolt-protocol" }
tokio-util = "0.7"
toml = "0.8"

[lints]
workspace = true
