[package]
name = "thunderbolt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Operator CLI for Bitcoin Thunderbolt nodes"
repository.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
thunderbolt-config = { path = "../thunderbolt-config" }
thunderbolt-protocol = { path = "../thunderbolt-protocol" }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.20"

[lints]
workspace = true
