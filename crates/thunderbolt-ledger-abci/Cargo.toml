[package]
name = "thunderbolt-ledger-abci"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CometBFT ABCI 2.0 adapter for the Bitcoin Thunderbolt v2 Ledger application"
keywords = ["bitcoin", "cometbft", "abci", "ledger"]
categories = ["cryptography::cryptocurrencies", "database"]

[features]
default = []
# Insecure proof acceptance exists only to drive an isolated live consensus
# compatibility test. Never enable this feature in a release deployment.
insecure-live-test = ["dep:prost"]

[[bin]]
name = "thunderbolt-ledger-abci-live-test"
path = "src/bin/live_test.rs"
required-features = ["insecure-live-test"]

[[test]]
name = "live_cometbft"
path = "tests/live_cometbft.rs"
required-features = ["insecure-live-test"]

[lints]
workspace = true

[dependencies]
bytes = "1.10.1"
prost = { version = "0.13.5", optional = true }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tendermint-abci = "0.40.4"
tendermint-proto = "0.40.4"
thiserror = "2.0.16"
thunderbolt-ledger = { path = "../thunderbolt-ledger" }
thunderbolt-ledger-app = { path = "../thunderbolt-ledger-app" }
thunderbolt-protocol = { path = "../thunderbolt-protocol" }

[dev-dependencies]
bitcoin = { version = "0.32.5", features = ["serde"] }
proptest = "1.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
secp256k1 = "0.31.1"
tempfile = "3.27.0"
thunderbolt-wire = { path = "../thunderbolt-wire" }
