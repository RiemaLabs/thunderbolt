[package]
name = "thunderbolt-verifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Trusted ledger-to-proof verification bridge for Bitcoin Thunderbolt"
keywords = ["bitcoin", "cryptography", "protocol", "verification"]
categories = ["cryptography::cryptocurrencies"]

[lints]
workspace = true

[dependencies]
bitcoin = { version = "0.32.5", features = ["serde"] }
thiserror = "2.0.12"
thunderbolt-protocol = { path = "../thunderbolt-protocol" }
thunderbolt-wire = { path = "../thunderbolt-wire" }

[dev-dependencies]
libpaillier = "0.6.0"
proptest = "1.7.0"
secp = { version = "0.5.0", features = ["rand", "secp256k1"] }
serde_json = "1.0"
thunderbolt-core = { path = "../thunderbolt-core" }
