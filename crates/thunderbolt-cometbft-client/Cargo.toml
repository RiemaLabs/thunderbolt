[package]
name = "thunderbolt-cometbft-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Crash-safe CometBFT trust coordinator for Bitcoin Thunderbolt"
keywords = ["bitcoin", "cometbft", "light-client", "sqlite", "thunderbolt"]
categories = ["cryptography::cryptocurrencies", "database"]

[lints]
workspace = true

[dependencies]
futures-util = "0.3.31"
libc = "0.2.177"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.2", features = ["process"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tendermint = "0.40.4"
tendermint-light-client-verifier = "0.40.4"
thiserror = "2.0.16"
thunderbolt-cometbft = { path = "../thunderbolt-cometbft" }
thunderbolt-ledger = { path = "../thunderbolt-ledger" }
tokio = { version = "1.48.0", features = ["io-util", "time"] }

[dev-dependencies]
bitcoin = "0.32.5"
ed25519-consensus = "2.1.0"
secp256k1 = "0.31.1"
tempfile = "3.27.0"
thunderbolt-wire = { path = "../thunderbolt-wire" }
tokio = { version = "1.48.0", features = ["io-util", "macros", "rt", "time"] }
