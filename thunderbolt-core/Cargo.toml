[package]
name = "thunderbolt-core"
version = "0.1.0"
edition = "2021"
description = "The core implementation of Thunderbolt"

[dependencies]
halo2-base = { git = "https://github.com/axiom-crypto/halo2-lib", tag = "v0.5.0" }
halo2-ecc = { git = "https://github.com/axiom-crypto/halo2-lib", tag = "v0.5.0" }
bitcoin = { version = "0.32.5", features = ["serde"] }
# Keep the same with bitcoin dependencies.
secp256k1 = { version = "^0.29.0", features = ["rand-std", "serde"] }
secp = { version = "^0.5.0" }
frost-secp256k1 = { version = "2.1.0"}
serde = { version = "^1.0.0" }
sha2 = { version = "^0.10.0" }
thiserror = "2.0.12"
itertools = "0.12"

bitcoin-utils = { path = "../bitcoin-utils" }
