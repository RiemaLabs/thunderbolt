[workspace]
members = ["crates/*"]
default-members = [
    "crates/thunderbolt-bitcoin",
    "crates/thunderbolt-cli",
    "crates/thunderbolt-committee",
    "crates/thunderbolt-config",
    "crates/thunderbolt-core",
    "crates/thunderbolt-holder",
    "crates/thunderbolt-keystore",
    "crates/thunderbolt-ledger",
    "crates/thunderbolt-node",
    "crates/thunderbolt-protocol",
    "crates/thunderbolt-storage",
    "crates/thunderbolt-verifier",
    "crates/thunderbolt-wire",
    "crates/thunderboltd",
]
resolver = "2"

[workspace.package]
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/RiemaLabs/thunderbolt-lib"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
# tendermint-rs 0.40.4 still resolves the archived `paste` crate through
# flex-error. The vendored source changes only that macro dependency to its
# maintained successor. See third_party/flex-error/README.md.
flex-error = { path = "third_party/flex-error" }

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = "symbols"
