[package]
name = "transfer-compare-script"
version = "0.1.0"
edition = "2021"
default-run = "transfer-compare"

[[bin]]
name = "transfer-compare"
path = "src/bin/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sp1-sdk = { version = "=6.0.1", features = ["blocking", "native-gnark"] }
transfer-compare-lib = { path = "../lib" }

[build-dependencies]
sp1-build = { version = "=6.0.1" }
